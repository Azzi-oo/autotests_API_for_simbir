name: api-tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start service stack
        run: docker compose up --build -d

      - name: Wait for service to become healthy
        run: |
          wait_for_service() {
            for i in $(seq 1 30); do
              if curl -fsS "${BASE_URL}/api/getAll" >/dev/null; then
                echo "service is up"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          for attempt in 1 2 3; do
            if wait_for_service; then
              exit 0
            fi
            echo "attempt ${attempt}: service did not respond, restarting service container" >&2
            docker compose ps
            docker compose logs --no-color service || true
            docker compose up -d --force-recreate --no-deps service
          done

          echo "service did not become healthy after retries" >&2
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Wait for migrations to finish
        run: |
          status=$(docker inspect -f '{{.State.ExitCode}}' autotests_api_for_simbir-migrate-1 2>/dev/null || echo missing)
          docker compose logs --no-color migrate || true
          # migrate exits non-zero when asked for more steps than exist; the
          # applied migrations above are what matters for the test schema.

      - name: Run pytest
        run: pytest tests

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Stop service stack
        if: always()
        run: docker compose down -v
